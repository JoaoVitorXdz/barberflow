services:
  postgres:
    image: postgres:16-alpine
    container_name: barberflow-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barberflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barberflow}
      POSTGRES_DB: ${POSTGRES_DB:-barberflow}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barberflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: barberflow-redis
    ports:
      - "6379:6379"

volumes:
  pgdata: